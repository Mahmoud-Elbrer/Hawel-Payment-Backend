spring:
  application:
      name: identity-service

  datasource:
    # Local development
    url: jdbc:mysql://localhost:3306/identity_db?createDatabaseIfNotExist=true

    # Docker Compose
    # url: jdbc:mysql://mysqldb:3306/blognewdb?createDatabaseIfNotExist=true

    username: root
    password: root123
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    properties:
      spring.json.add.type.headers: true

server:
  servlet:
    context-path: /api

  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:zFiJGnlUQzihfKMtOjy98HW/6RxFtaFEj8ypqwbSh6Y=}
    issuer: ${JWT_ISSUER:identity-service}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000


logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html







