spring:
  application:
    name: transaction-service

  datasource:
    # Local development
    url: jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true

    # Docker Compose
    # url: jdbc:mysql://mysqldb:3306/blognewdb?createDatabaseIfNotExist=true

    username: root
    password: root123
  #    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.hawel.common_service.event
        spring.json.use.type.headers: true

    properties:
      spring.json.add.type.headers: true

server:
  servlet:
    context-path: /api

  port: 8084

logging:
  level:
    org.springframework.security: DEBUG
    com.hawel.transaction_service: DEBUG


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

services:
  wallet:
    url: http://localhost:8082
  ledger:
    url: http://localhost:8083





